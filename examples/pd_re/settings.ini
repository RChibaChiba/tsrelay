# 試験用: Pd(PH3)2 からのエタンの還元的脱離を、生成物側（エタン錯体）から逆にたどる
[input]
substrate = ethane.xyz
catalyst = pd_ph3_2.xyz
workdir = run01

[state]
total_charge = 0
total_multiplicity = 1
substrate_charge = 0
substrate_multiplicity = 1
catalyst_charge = 0
catalyst_multiplicity = 1

[dock]
# 金属に向ける基質原子（基質ファイル内、1 始まり）
directed_atoms = 1,2
xtb_args = --gfn2

[core]
cutoff_scale = 1.2
add_atoms =
drop_atoms =

[scan]
# 動かす原子ペアと目標距離（Å）。錯体の番号（基質が先、触媒が後）。Pd は 9 番
# C–C を切り、同時に Pd–C を作って cis-Pd(CH3)2(PH3)2 にする
bonds = 1-2:2.9, 1-9:2.1, 2-9:2.1
nstep = 10

[uma]
# facebook/UMA の checkpoints/<model>.pt。ランタイムが HF から取る（手元には要らない）
model = uma-s-1p2p1

[ts]
fmax_opt = 0.02
fmax_ts = 0.005

[run]
cores = 6
session = tsrelay
